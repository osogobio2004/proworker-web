{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4">
                <h2 class="fw-bold mb-4">Configuración de mi perfil</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row align-items-center mb-4">
                        <div class="col-auto text-center">
                            <img src="{{ request.user.perfil.foto_perfil.url }}" class="rounded-circle shadow" style="width: 120px; height: 120px; object-fit: cover; border: 4px solid #f8f9fa;">
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">Cambiar foto de perfil</label>
                            {{ form.foto_perfil }}
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Nombre(s)</label>
                            {{ form.first_name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Apellidos</label>
                            {{ form.last_name }}
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small text-uppercase text-muted">Correo Electrónico</label>
                            {{ form.email }}
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold">Actualizar mis Datos</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
