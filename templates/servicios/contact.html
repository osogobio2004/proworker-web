{% extends "base.html" %}

{% block title %}Contacto | ProWorker{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="row g-0">
            <div class="col-md-6 p-5 bg-white">
                <h3 class="fw-bold mb-4" style="color: var(--color-primario);">Canal de soporte</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mensaje corporativo</label>
                        <textarea class="form-control" rows="4" required></textarea>
                    </div>
                    <button class="btn btn-primary w-100 shadow-sm" style="background-color: var(--color-acento);">Enviar mensaje</button>
                </form>
            </div>
            <div class="col-md-6 bg-light d-flex flex-column">
                <div class="p-5 flex-grow-0">
                    <h4 class="fw-bold mb-3">Oficinas corporativas</h4>
                    <p class="text-muted mb-1"><i class="bi bi-geo-alt-fill me-2 text-danger"></i>Villahermosa, Centro, Tabasco.</p>
                    <p class="text-muted"><i class="bi bi-envelope-fill me-2 text-primary"></i>contacto@proworker.com.mx</p>
                </div>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d121475.2974377034!2d-92.99343355209355!3d17.99757657929424!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85edc7606e308f6f%3A0xc6c42a229a4a755!2sVillahermosa%2C%20Tab.!5e0!3m2!1ses!2smx!4v1715880000000!5m2!1ses!2smx" 
                    width="100%" height="100%" style="border:0; min-height: 280px;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </div>
</div>
{% endblock %}
