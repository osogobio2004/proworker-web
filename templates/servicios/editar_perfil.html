{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-5 shadow-sm border-0">
                <h3 class="fw-bold mb-4 text-center" style="color: var(--color-primario);">Mi oficina </h3>
                <p class="text-muted text-center mb-4">Configura tu perfil profesional para recibir solicitudes locales.</p>
                
                <form method="POST" action="" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Especialidad técnica</label>
                            <select class="form-select">
                                <option>Electricidad</option>
                                <option>Fontanería</option>
                                <option>Climatización</option>
                                <option>Limpieza</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Municipio de cobertura principal</label>
                            <select class="form-select">
                                <option>Balancán</option>
                                <option>Cárdenas</option>
                                <option>Centla</option>
                                <option>Centro (Villahermosa)</option>
                                <option>Comalcalco</option>
                                <option>Cunduacán</option>
                                <option>Huimanguillo</option>
                                <option>Jalapa</option>
                                <option>Jalpa de Méndez</option>
                                <option>Jonuta</option>
                                <option>Macuspana</option>
                                <option>Nacajuca</option>
                                <option>Paraíso</option>
                                <option>Emiliano Zapata</option>
                                <option>Paraíso</option>
                                <option>Tacotalpa</option>
                                <option>Teapa</option>
                                <option>Tenosique</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Teléfono de enlace corporativo (WhatsApp)</label>
                        <input type="tel" class="form-control" placeholder="Ej. 993XXXXXXX" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Presentación pública de tus servicios</label>
                        <textarea class="form-control" rows="4" placeholder="Describe tu experiencia, certificaciones y garantías de trabajo..." required></textarea>
                    </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm mt-3" style="background-color: #0071E3; border-color: #0071E3;">
                            Guardar perfil profesional
                        </button>                
                        </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
