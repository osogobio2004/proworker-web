{% extends "base.html" %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="saas-card p-4 p-md-5">
                <div class="text-center mb-5">
                    <h3 class="fw-bold" style="color: var(--txt-main); letter-spacing: -0.03em;">Configurar Oficina</h3>
                    <p style="color: var(--txt-muted); font-size: 0.95rem;">Establece los detalles de tus servicios para que los clientes te encuentren.</p>
                </div>
                
                <form method="POST" action="" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="color: var(--txt-main); font-size: 0.9rem;">Mis especialidades</label>
                        <div class="row g-2 p-3" style="background-color: var(--bg-workspace); border-radius: var(--radius-saas); border: 1px solid var(--border-saas);">
                            {% for esp in all_especialidades %}
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input shadow-none" type="checkbox" name="especialidades" value="{{ esp.id }}" id="esp_{{ esp.id }}"
                                            {% if esp in perfil.especialidades.all %} checked {% endif %}>
                                        <label class="form-check-label text-muted small fw-medium" for="esp_{{ esp.id }}">
                                            {{ esp.nombre }}
                                        </label>
                                    </div>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="color: var(--txt-main); font-size: 0.9rem;">Municipio de cobertura principal</label>
                        <select name="municipio" class="form-select shadow-none" style="border-color: var(--border-saas); border-radius: 8px; color: var(--txt-main); font-size: 0.95rem;">
                            <option value="Balancán" {% if perfil.municipio == "Balancán" %}selected{% endif %}>Balancán</option>
                            <option value="Cárdenas" {% if perfil.municipio == "Cárdenas" %}selected{% endif %}>Cárdenas</option>
                            <option value="Centla" {% if perfil.municipio == "Centla" %}selected{% endif %}>Centla</option>
                            <option value="Centro" {% if perfil.municipio == "Centro" %}selected{% endif %}>Centro (Villahermosa)</option>
                            <option value="Comalcalco" {% if perfil.municipio == "Comalcalco" %}selected{% endif %}>Comalcalco</option>
                            <option value="Cunduacán" {% if perfil.municipio == "Cunduacán" %}selected{% endif %}>Cunduacán</option>
                            <option value="Huimanguillo" {% if perfil.municipio == "Huimanguillo" %}selected{% endif %}>Huimanguillo</option>
                            <option value="Jalapa" {% if perfil.municipio == "Jalapa" %}selected{% endif %}>Jalapa</option>
                            <option value="Jalpa de Méndez" {% if perfil.municipio == "Jalpa de Méndez" %}selected{% endif %}>Jalpa de Méndez</option>
                            <option value="Jonuta" {% if perfil.municipio == "Jonuta" %}selected{% endif %}>Jonuta</option>
                            <option value="Macuspana" {% if perfil.municipio == "Macuspana" %}selected{% endif %}>Macuspana</option>
                            <option value="Nacajuca" {% if perfil.municipio == "Nacajuca" %}selected{% endif %}>Nacajuca</option>
                            <option value="Paraíso" {% if perfil.municipio == "Paraíso" %}selected{% endif %}>Paraíso</option>
                            <option value="Emiliano Zapata" {% if perfil.municipio == "Emiliano Zapata" %}selected{% endif %}>Emiliano Zapata</option>
                            <option value="Tacotalpa" {% if perfil.municipio == "Tacotalpa" %}selected{% endif %}>Tacotalpa</option>
                            <option value="Teapa" {% if perfil.municipio == "Teapa" %}selected{% endif %}>Teapa</option>
                            <option value="Tenosique" {% if perfil.municipio == "Tenosique" %}selected{% endif %}>Tenosique</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold" style="color: var(--txt-main); font-size: 0.9rem;">Teléfono de enlace corporativo</label>
                        <input type="tel" name="telefono" class="form-control shadow-none" style="border-color: var(--border-saas); border-radius: 8px; color: var(--txt-main); font-size: 0.95rem;" placeholder="Ej. 993XXXXXXX" value="{{ perfil.telefono|default_if_none:'' }}" required>
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label fw-semibold" style="color: var(--txt-main); font-size: 0.9rem;">Presentación pública de tus servicios</label>
                        <textarea name="presentacion" class="form-control shadow-none" rows="5" style="border-color: var(--border-saas); border-radius: 8px; color: var(--txt-main); resize: none; font-size: 0.95rem;" placeholder="Describe tu experiencia, certificaciones y forma de trabajo...">{{ perfil.presentacion|default_if_none:'' }}</textarea>
                    </div>
                    
                    <button type="submit" class="btn w-100 text-white fw-medium py-2 shadow-sm" style="background-color: var(--blue-saas); border-radius: 8px;">
                        Guardar perfil profesional
                    </button>                
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
