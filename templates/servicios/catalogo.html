{% extends "base.html" %}

{% block title %}Catálogo de Especialistas | ProWorker{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-5 align-items-center bg-white p-4 rounded-4 shadow-sm border border-light">
        <div class="col-md-4 mb-3 mb-md-0">
            <h3 class="fw-bold mb-1 text-dark">Buscar Especialistas</h3>
            <p class="text-muted small mb-0">Resultados localizados para mitigar gastos de traslado.</p>
        </div>
        <div class="col-md-8">
            <form class="row g-2">
                <div class="col-md-5">
                    <select class="form-select">
                        <option>Todos los oficios</option>
                        <option>Electricidad</option>
                        <option>Fontanería</option>
                        <option>Climatización</option>
                        <option>Limpieza</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <select class="form-select">
                        <option>Cualquier Municipio</option>
                        <option>Centro (Villahermosa)</option>
                        <option>Cárdenas</option>
                        <option>Huimanguillo</option>
                        <option>Comalcalco</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 shadow-sm fw-bold"><i class="bi bi-search me-1"></i> Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card text-center p-4 border shadow-sm">
                <div class="mx-auto bg-light rounded-circle d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                    <i class="bi bi-person-fill display-5 text-secondary"></i>
                </div>
                <h5 class="fw-bold mb-1 text-dark">Carlos Mendoza</h5>
                <span class="badge bg-primary mb-2 px-3 py-1">Climatización</span>
                <p class="text-muted small mb-3"><i class="bi bi-geo-alt-fill text-danger me-1"></i> Centro, Tabasco</p>
                <a href="{% url 'perfil_tecnico' %}" class="btn btn-outline-primary btn-sm w-100 mt-2">Ver Perfil Técnico</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
