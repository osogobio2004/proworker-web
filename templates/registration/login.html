{% extends "base.html" %}

{% block title %}Iniciar Sesión | ProWorker{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5"> <div class="card shadow border-0" style="border-top: 4px solid var(--color-acento);">
                <div class="card-body p-5">
                    
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle display-4" style="color: var(--color-primario);"></i>
                        <h2 class="fw-bold mt-2" style="color: var(--color-primario);">Bienvenido de nuevo</h2>
                        <p class="text-muted">Ingresa tus credenciales para continuar</p>
                    </div>

                    <form method="POST" action="">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Ej. juan_perez" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">Iniciar Sesión</button>
                        </div>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">¿Aún no tienes cuenta en ProWorker?</p>
                            <a href="#" class="text-decoration-none fw-bold" style="color: var(--color-acento);">Regístrate aquí</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
