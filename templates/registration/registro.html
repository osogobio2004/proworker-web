{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-0">
                <h3 class="fw-bold mb-4 text-center" style="color: var(--color-primario);">Registrar nueva cuenta</h3>
                <form method="POST" action="">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3 text-dark text-start">
                            <label class="form-label fw-semibold small">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text small text-muted" style="font-size: 0.75rem;">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger small fw-bold">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 text-white fw-bold shadow-sm py-2 mt-2" style="background-color: #0071E3 !important; border-color: #0071E3 !important;">Completar Registro</button>
                </form>
            </div>
        </div>
    </div>
</div>
</main>
{% endblock %}
